name: Windows build

# Runs only when Windows files change, or by hand, so it can't slow normal PRs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-Windows-x64
          path: build/windows/x64/runner/Release
          if-no-files-found: error
