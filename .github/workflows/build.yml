name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Android build disk
        run: bash ci/free-android-disk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install and verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" &&
               test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK $NDK_VERSION verified"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android NDK $NDK_VERSION installation failed after 3 attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 10
          done
      - run: flutter pub get
      - run: flutter build apk --release --no-pub

  ios:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub

  linux:
    # Pinned: ubuntu-latest moved to 26.04 in November 2026, and its newer
    # glibc headers clash with Flutter 3.47's Linux build
    # (pthread_once / __once_flag). Move up once Flutter builds there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - name: Provide ONNX Runtime if its GitHub download is missing
        # flutter_onnxruntime downloads ONNX Runtime from Microsoft's GitHub
        # releases while building. From 2026-11-18 that repository returned
        # 404, so this fetches the same 1.x series from Microsoft's NuGet
        # package and puts it where the plugin looks, which skips its download.
        # It does nothing while the GitHub download works.
        run: |
          set -euo pipefail
          plugin=$(python3 -c "import json; c=json.load(open('.dart_tool/package_config.json')); print(next(p['rootUri'] for p in c['packages'] if p['name']=='flutter_onnxruntime').removeprefix('file://'))")
          ver=$(grep -oE 'set\(ONNXRUNTIME_VERSION "[0-9.]+"\)' "$plugin/linux/CMakeLists.txt" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
          if curl -sfIL "$url" > /dev/null; then
            echo "GitHub has ONNX Runtime ${ver}; the plugin downloads it as usual."
            exit 0
          fi
          series=${ver%.*}
          nuget=$(curl -sf https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/index.json | python3 -c "import json,sys; v=[x for x in json.load(sys.stdin)['versions'] if x.startswith('${series}.') and '-' not in x]; print(v[-1] if v else '')")
          if [ -z "$nuget" ]; then echo "::error::No ONNX Runtime ${series}.x on GitHub or NuGet"; exit 1; fi
          dest=build/linux/x64/release/plugins/flutter_onnxruntime/onnxruntime/onnxruntime-linux-x64-${ver}
          mkdir -p "$dest/include" "$dest/lib"
          curl -sfL -o "$RUNNER_TEMP/ort.nupkg" "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/${nuget}/microsoft.ml.onnxruntime.${nuget}.nupkg"
          unzip -q -j -o "$RUNNER_TEMP/ort.nupkg" 'build/native/include/*' -d "$dest/include"
          unzip -q -j -o "$RUNNER_TEMP/ort.nupkg" 'runtimes/linux-x64/native/*' -d "$dest/lib"
          # Lay the library out as Microsoft's download does: the versioned
          # file, plus the libonnxruntime.so.1 name the plugin's build links by.
          (cd "$dest/lib" && mv libonnxruntime.so "libonnxruntime.so.${nuget}" && ln -s "libonnxruntime.so.${nuget}" libonnxruntime.so.1 && ln -s libonnxruntime.so.1 libonnxruntime.so)
          test -f "$dest/include/onnxruntime_cxx_api.h" && test -e "$dest/lib/libonnxruntime.so"
          echo "::warning::ONNX Runtime ${ver} isn't on GitHub; built with ${nuget} from NuGet instead."
      - run: flutter build linux --release --no-pub

  macos:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub --obfuscate --split-debug-info=build/symbols/macos
      - name: Verify and package universal Mac candidate
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/NOTORYX Core.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/NOTORYX Core")
          case "$ARCHS" in *x86_64*) ;; *) exit 1;; esac
          case "$ARCHS" in *arm64*) ;; *) exit 1;; esac
          test "$(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' "$APP/Contents/Info.plist")" = false
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/NOTORYX-Core-$VERSION-macOS-universal.zip"
          cp -R build/symbols/macos "dist/symbols-$VERSION"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          shasum -a 256 *.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-macOS-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
