name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Android build disk
        run: bash ci/free-android-disk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install and verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" &&
               test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK $NDK_VERSION verified"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android NDK $NDK_VERSION installation failed after 3 attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 10
          done
      - run: flutter pub get
      - run: flutter build apk --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} --release --no-pub

  ios:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} --release --no-codesign --no-pub

  linux:
    # Pinned: ubuntu-latest moved to 26.04 in November 2026, and its newer
    # glibc headers clash with Flutter 3.47's Linux build
    # (pthread_once / __once_flag). Move up once Flutter builds there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - name: Provide ONNX Runtime for Linux
        # flutter_onnxruntime downloads ONNX Runtime from
        # github.com/microsoft/onnxruntime releases, which returns 404 since
        # November 2026. Put the same library, from Microsoft's NuGet
        # package, where the plugin looks before downloading.
        run: |
          plugin=$(jq -r '.packages[] | select(.name=="flutter_onnxruntime") | .rootUri' .dart_tool/package_config.json | sed 's|^file://||')
          want=$(grep -oP 'set\(ONNXRUNTIME_VERSION "\K[0-9.]+' "$plugin/linux/CMakeLists.txt" | head -1)
          nuget=1.28.0
          dir=build/linux/x64/release/plugins/flutter_onnxruntime/onnxruntime/onnxruntime-linux-x64-$want
          curl -fsSL --retry 3 -o /tmp/ort.nupkg "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$nuget/microsoft.ml.onnxruntime.$nuget.nupkg"
          mkdir -p /tmp/ort "$dir/lib"
          unzip -q /tmp/ort.nupkg 'build/native/include/*' 'runtimes/linux-x64/native/*' -d /tmp/ort
          cp -r /tmp/ort/build/native/include "$dir/include"
          cp /tmp/ort/runtimes/linux-x64/native/*.so "$dir/lib/"
          # Same layout as the release tarball: the library's soname is
          # libonnxruntime.so.1, which the linker looks for by that name.
          mv "$dir/lib/libonnxruntime.so" "$dir/lib/libonnxruntime.so.1"
          ln -s libonnxruntime.so.1 "$dir/lib/libonnxruntime.so"
          ls "$dir/include/onnxruntime_cxx_api.h" "$dir/lib/libonnxruntime.so"
      - run: flutter build linux --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} --release --no-pub

  macos:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} --release --no-pub --obfuscate --split-debug-info=build/symbols/macos
      - name: Verify and package universal Mac candidate
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/NOTORYX Core.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/NOTORYX Core")
          case "$ARCHS" in *x86_64*) ;; *) exit 1;; esac
          case "$ARCHS" in *arm64*) ;; *) exit 1;; esac
          test "$(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' "$APP/Contents/Info.plist")" = false
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/NOTORYX-Core-$VERSION-macOS-universal.zip"
          cp -R build/symbols/macos "dist/symbols-$VERSION"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          shasum -a 256 *.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-macOS-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }} --release --no-pub
