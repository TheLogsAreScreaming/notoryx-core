name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Android build disk
        run: bash ci/free-android-disk.sh
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install and verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" &&
               test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"; then
              echo "Android NDK $NDK_VERSION verified"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android NDK $NDK_VERSION installation failed after 3 attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 10
          done
      - run: flutter pub get
      - run: flutter build apk --release --no-pub

  ios:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --no-pub

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release --no-pub

  macos:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'release/')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --no-pub --obfuscate --split-debug-info=build/symbols/macos
      - name: Verify and package universal Mac candidate
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/NOTORYX Core.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/NOTORYX Core")
          case "$ARCHS" in *x86_64*) ;; *) exit 1;; esac
          case "$ARCHS" in *arm64*) ;; *) exit 1;; esac
          test "$(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' "$APP/Contents/Info.plist")" = false
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/NOTORYX-Core-$VERSION-macOS-universal.zip"
          cp -R build/symbols/macos "dist/symbols-$VERSION"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          cd dist
          shasum -a 256 *.zip > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-macOS-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
