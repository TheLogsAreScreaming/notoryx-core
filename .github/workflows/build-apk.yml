name: Build NOTORYX Core APK

# Installable Android build for testing: every push to dev and every PR
# produces a downloadable "NOTORYX-Core-Android-ARM64" artifact (Actions run
# page, Artifacts section). Pushes to dev and manual runs also produce
# "NOTORYX-Core-Android-AAB" for Google Play. Both are debug-signed here and
# must be re-signed with the release key on the maintainer's Mac.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Android build disk
        run: bash ci/free-android-disk.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install and verify Android CMake
        shell: bash
        run: |
          set -euo pipefail
          # Install before Gradle so a transient download failure can be retried.
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" &&
               "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android CMake 3.22.1 could not be installed and verified"
              exit 1
            fi
            # Discard only SDK installer staging and the failed CMake package.
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/cmake/3.22.1"
            sleep 10
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NOTORYX-Core-arm64-v8a.apk
          cd dist
          sha256sum NOTORYX-Core-arm64-v8a.apk > SHA256SUMS.txt
          # What this artifact was built from. This workflow builds only:
          # tests for the same commit run in "Flutter and Dart".
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          def sha(path):
              with open(path, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()
          server = os.environ['GITHUB_SERVER_URL']; repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          try:
              out = subprocess.run(['flutter', '--version', '--machine'], capture_output=True, text=True).stdout
              version = json.loads(out[out.index('{'):])
          except Exception:
              version = {}
          info = {
              'kind': 'build-only',
              'commit': commit,
              'ref': os.environ['GITHUB_REF'],
              'run': f"{server}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'tests_for_commit': f"{server}/{repo}/commit/{commit}/checks",
              'flutter': version.get('frameworkVersion'),
              'pubspec_lock_sha256': sha('../pubspec.lock'),
              'artifact': 'NOTORYX-Core-arm64-v8a.apk',
              'artifact_sha256_before_signing': sha('NOTORYX-Core-arm64-v8a.apk'),
          }
          json.dump(info, open('BUILD-INFO.json', 'w'), indent=2)
          print(json.dumps(info, indent=2))
          PY
          ls -lh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Build release app bundle
        if: github.event_name != 'pull_request'
        run: flutter build appbundle --release --no-pub

      - name: Prepare app bundle artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist-aab
          cp build/app/outputs/bundle/release/app-release.aab dist-aab/NOTORYX-Core.aab
          cd dist-aab
          sha256sum NOTORYX-Core.aab > SHA256SUMS.txt
          ls -lh

      - name: Upload app bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Core-Android-AAB
          path: dist-aab/
          if-no-files-found: error
