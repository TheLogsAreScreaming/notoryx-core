name: Bastion Bot Mode Android APK

on:
  push:
    branches: [bastion, bastion-bot-mode]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up known-good Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate approved Bastion launcher icons
        run: |
          echo "00393b601be8a7be1dd4f73b64c25718887e27fa75eb8dbf1796c80e76c828d1  branding/bastion-icon.png" | sha256sum -c -
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
      - name: Wire Bastion home into startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart');s=p.read_text();needle="import 'screens/scanner_screen.dart';"
          if 'bastion_home_screen.dart' not in s:s=s.replace(needle,needle+"\nimport 'screens/bastion_home_screen.dart';")
          s=s.replace("title: 'MeshCore Open'","title: 'Bastion'").replace(": const ScannerScreen(),",": const BastionHomeScreen(),");p.write_text(s)
          PY
      - name: Verify Bastion branding source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              Path('lib/l10n/app_en.arb'),
              Path('lib/l10n/app_localizations_en.dart'),
              Path('lib/main.dart'),
          ]
          for p in checks:
              s = p.read_text()
              if "MeshCore Open" in s and "Built with open-source MeshCore Open components" not in s:
                  raise SystemExit(f"Visible MeshCore Open branding remains in {p}")
          PY
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --timeout 2m
      - name: Build Bastion RC1 APK
        run: flutter build apk --release --target-platform android-arm64 --target lib/main.dart
      - name: Verify packaged Bastion icon resources
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/bastion-badging.txt
          grep -F "package: name='com.bastionmesh.bastion'" /tmp/bastion-badging.txt
          grep -F "launchable-activity: name='com.meshcore.meshcore_open.MainActivity'" /tmp/bastion-badging.txt
          "$AAPT" dump resources "$APK" > /tmp/bastion-resources.txt
          grep -F 'mipmap/ic_launcher' /tmp/bastion-resources.txt
          grep -F 'drawable/ic_launcher_foreground' /tmp/bastion-resources.txt
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          with ZipFile(apk) as z:
              images = [n for n in z.namelist() if n.startswith('res/') and n.endswith('.png')]
              if not images:
                  raise SystemExit('No packaged PNG resources found')
              print(f'Packaged PNG resources: {len(images)}')
          PY
      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
      - name: Upload Bastion RC1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-MeshCore-Bot-Mode-APK
          path: dist/app-release.apk
          if-no-files-found: error
          retention-days: 14
