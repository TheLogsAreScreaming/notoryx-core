name: meshcore_open
description: "NOTORYX Core: an independent MeshCore LoRa companion app"
publish_to: 'none'
version: 10.0.0-rc.42+94

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.1.0
  flserial:
    git:
      url: https://github.com/MeshEnvy/flserial.git
      ref: 48216310061efc8d5d217cc18014fc2cb501646e
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  http: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_foreground_task: ^9.2.0
  characters: ^1.4.0
  package_info_plus: ^10.1.0
  mobile_scanner: ^7.1.4
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  flutter_linkify: ^6.0.0
  gpx: ^2.3.0
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  file_selector: ^1.1.0
  build_pipe: ^0.3.1
  material_symbols_icons: ^4.2928.1
  web: ^1.1.1
  flutter_svg: ^2.0.10+1
  flutter_blue_plus_platform_interface: ^9.0.2
  ml_algo: ^16.0.0
  ml_dataframe: ^1.0.0
  llamadart: ^0.8.0
  flutter_langdetect: ^0.0.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  convert: ^3.1.2
  flutter_onnxruntime: ^1.8.3
  flutter_tts: ^4.2.5
  quick_actions: ^1.1.1
  mqtt_client: ^10.13.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.1
  home_widget: ^0.10.0
  h3_flutter: ^0.7.1
  geolocator: ^14.1.2
  app_links: ^7.2.2
  sqlite3: ^3.9.0
  local_auth: ^3.0.2

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
    llamadart:
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
          android-x64:
            backends: [cpu]

dev_dependencies:
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/regional_presets.json
    - assets/region_trees.json
    - assets/channel_directory.json
  fonts:
    # Static weights cut from the Inter and JetBrains Mono variable fonts.
    # Flutter fakes bold on a variable font's default instance, so each
    # weight the app uses needs its own file.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/notoryx-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#150F0D"
  adaptive_icon_foreground: "branding/notoryx-icon-foreground.png"
  macos:
    generate: true
    image_path: "branding/notoryx-icon-macos.png"
  web:
    generate: true
    image_path: "branding/notoryx-icon.png"
    background_color: "#150F0D"
    theme_color: "#FF9A3C"

build_pipe:
  workflows:
    default:
      clean_flutter: true
      generate_log: true
      platforms:
        web:
          build:
            build_command: flutter build web --release --pwa-strategy=none
            add_version_query_param: true
